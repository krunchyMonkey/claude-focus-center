name: Validate project specification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate planning structure
        run: |
          test -s CLAUDE.md
          test -s docs/MVP-SPEC.md
          test -s docs/ARCHITECTURE.md
          test -s docs/SECURITY.md
          test -s docs/AGENT-KICKOFF.md
          test -s planning/PROGRESS.md
          test "$(tail -n +2 planning/issue-index.tsv | wc -l | tr -d ' ')" -eq 16
      - name: Shell syntax
        run: bash -n scripts/start-personal-build.sh scripts/create-project-board.sh
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse GitHub Projects setup script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/create-project-board.ps1').Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
